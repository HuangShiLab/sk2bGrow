[workspace]
resolver = "2"
members = ["crates/sk2bgrow-core", "crates/sk2bgrow-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
license = "MIT"
repository = "https://github.com/your-org/sk2bGrow"
description = "PTR estimation from deterministic 2bRAD/TGT anchors (Type IIB restriction tags)"

[workspace.dependencies]
anyhow = "1"
thiserror = "1"
clap = { version = "4", features = ["derive"] }
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
flate2 = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
