[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sk2bgrow"
version = "0.1.0"
description = "Statistics layer for sk2bGrow: PTR estimation from deterministic 2bRAD/TGT anchors"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "statsmodels>=0.14",
    "pyarrow>=12.0",
]

[project.optional-dependencies]
plots = ["matplotlib>=3.7"]
dev = ["pytest>=7.0", "pytest-cov", "ruff"]

[project.scripts]
sk2bgrow-stats = "sk2bgrow.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["sk2bgrow*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["../tests/python"]
